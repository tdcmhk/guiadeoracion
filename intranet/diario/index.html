<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Diario de Oración — Movilización Turquía</title>

  <!-- PWA Fullscreen Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a365d">
  <link rel="manifest" href="/intranet/boletin-de-oracion/manifest.json">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/assets/css/diario.css">
  <script type="module" src="/assets/js/diario.js"></script>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div style="display: flex; gap: 8px;">
        <a href="/intranet/boletin-de-oracion/" class="btn-nav-top">
          <span class="material-symbols-outlined">menu_book</span>
          <span>Boletín</span>
        </a>
        <a href="/intranet/perfil/" class="btn-nav-top">
          <span class="material-symbols-outlined">person</span>
          <span>Mi Perfil</span>
        </a>
      </div>
      <button id="btnCerrarSesion" class="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <main class="container">

    <!-- CABECERA DEL DIARIO -->
    <div class="diario-header">
      <div class="header-icon">
        <span class="material-symbols-outlined">book_4</span>
      </div>
      <div>
        <h1>Mi Diario de Oración</h1>
        <p>Registra tu clamor, persevera en la intercesión y celebra las respuestas de Dios.</p>
      </div>
    </div>

    <!-- LAS 4 TARJETAS INTERACTIVAS (CONTADORES Y SELECTORES) -->
    <div class="stats-selector-grid">
      <!-- 1. ORADOS -->
      <button type="button" class="stat-card active" data-tab="orados" onclick="cambiarPestana('orados')">
        <div class="stat-card-icon icon-orados">
          <span class="material-symbols-outlined">folded_hands</span>
        </div>
        <div class="stat-card-info">
          <span class="stat-number" id="numOrados">0</span>
          <span class="stat-title">Motivos Orados</span>
        </div>
      </button>

      <!-- 2. GUARDADOS -->
      <button type="button" class="stat-card" data-tab="guardados" onclick="cambiarPestana('guardados')">
        <div class="stat-card-icon icon-guardados">
          <span class="material-symbols-outlined">bookmark</span>
        </div>
        <div class="stat-card-info">
          <span class="stat-number" id="numGuardados">0</span>
          <span class="stat-title">Motivos Guardados</span>
        </div>
      </button>

      <!-- 3. CONTESTADOS -->
      <button type="button" class="stat-card" data-tab="contestados" onclick="cambiarPestana('contestados')">
        <div class="stat-card-icon icon-contestados">
          <span class="material-symbols-outlined">verified</span>
        </div>
        <div class="stat-card-info">
          <span class="stat-number" id="numContestados">0</span>
          <span class="stat-title">Contestados</span>
        </div>
      </button>

      <!-- 4. PROPIOS -->
      <button type="button" class="stat-card" data-tab="propios" onclick="cambiarPestana('propios')">
        <div class="stat-card-icon icon-propios">
          <span class="material-symbols-outlined">edit_note</span>
        </div>
        <div class="stat-card-info">
          <span class="stat-number" id="numPropios">0</span>
          <span class="stat-title">Motivos Propios</span>
        </div>
      </button>
    </div>

    <!-- CONTENEDOR DINÁMICO DE HISTORIAL -->
    <section class="content-section">

      <!-- TÍTULO DE LA SECCIÓN ACTIVA Y BOTONES DE ACCIÓN -->
      <div class="section-top-bar">
        <h2 id="tituloSeccionActiva">Motivos Orados</h2>
        <!-- Botón solo visible en "Motivos Propios" -->
        <button type="button" id="btnNuevoMotivoPropio" class="btn-primary-action" style="display: none;" onclick="abrirModalPropio(true)">
          <span class="material-symbols-outlined">add</span>
          <span>Nueva Petición Personal</span>
        </button>
      </div>

      <!-- LISTA DINÁMICA DE ELEMENTOS -->
      <div id="contenedorLista" class="items-list">
        <div class="loading-state">Cargando tu diario espiritual...</div>
      </div>

    </section>

  </main>

  <!-- MODAL: AGREGAR MOTIVO PROPIO (PETICIÓN PERSONAL) -->
  <div id="modalMotivoPropio" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Agregar Motivo Personal</h3>
        <button type="button" onclick="abrirModalPropio(false)" class="btn-close-modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="formMotivoPropio">
        <div class="form-group">
          <label>Título o Persona por quien oras</label>
          <input type="text" id="inpPropioTitulo" placeholder="Ej: Salud de mi mamá / Empleo" required>
        </div>
        <div class="form-group">
          <label>Detalle de la Petición</label>
          <textarea id="inpPropioDetalle" rows="3" placeholder="Describe brevemente la causa de tu clamor..." required></textarea>
        </div>
        <button type="submit" id="btnGuardarPropio" class="btn-modal-submit">Guardar en mi Diario</button>
      </form>
    </div>
  </div>

  <!-- MODAL: MARCAR COMO CONTESTADO (TESTIMONIO) -->
  <div id="modalContestar" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>✨ ¡Dios respondió la oración!</h3>
        <button type="button" onclick="abrirModalContestar(false)" class="btn-close-modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="formContestar">
        <input type="hidden" id="contestarId">
        <input type="hidden" id="contestarTitulo">
        <div class="form-group">
          <label>Petición:</label>
          <p id="contestarPeticionTexto" style="font-weight:700; color:var(--primary); margin:0 0 10px 0;"></p>
        </div>
        <div class="form-group">
          <label>Escribe tu Testimonio / Cómo respondió Dios:</label>
          <textarea id="inpTestimonio" rows="3" placeholder="Describe la victoria y respuesta del Señor..." required></textarea>
        </div>
        <button type="submit" class="btn-modal-submit" style="background:#15803d;">Guardar como Testimonio</button>
      </form>
    </div>
  </div>

</body>
</html>
