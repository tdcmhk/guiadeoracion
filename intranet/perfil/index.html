<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mi Perfil y Dashboard — Movilización Turquía</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="funciones.js" defer></script>

</head>
<body>

  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="/intranet/boletin-de-oracion/" class="btn-volver">
        <span class="material-symbols-outlined">arrow_back</span>
        <span>Ir al Boletín de Oración</span>
      </a>
      <button onclick="cerrarSesion()" style="background:none; border:none; color:#dc2626; font-weight:700; cursor:pointer;">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="dashboard-container">

    <!-- COLUMNA IZQUIERDA: TARJETA DEL USUARIO + BOTÓN EDITAR PERFIL -->
    <section class="card">
      <div class="user-header">
        <img id="userFoto" src="https://ui-avatars.com/api/?name=Intercesor&background=1a365d&color=fff" alt="Foto" class="user-avatar">
        <h3 id="userSaludo" style="margin: 0 0 6px 0; color: var(--primary);">Cargando perfil...</h3>
        <span id="userRol" class="badge-rol">Intercesor</span>
      </div>

      <!-- Resumen limpio de sus datos -->
      <div id="vistaResumenDatos" class="profile-summary">
        <div class="summary-row">
          <span class="material-symbols-outlined">call</span>
          <span id="txtTelefono">Sin teléfono</span>
        </div>
        <div class="summary-row">
          <span class="material-symbols-outlined">public</span>
          <span id="txtPais">Sin país</span>
        </div>
        <div class="summary-row">
          <span class="material-symbols-outlined">church</span>
          <span id="txtIglesia">Sin iglesia</span>
        </div>

        <button type="button" class="btn-edit-toggle" onclick="mostrarFormularioPerfil(true)">
          <span class="material-symbols-outlined" style="font-size:18px;">edit</span>
          <span>Editar Perfil</span>
        </button>
      </div>

      <!-- Formulario de edición (Oculto hasta tocar "Editar Perfil") -->
      <form id="formPerfil" class="profile-form">
        <label>Nombre</label>
        <input type="text" id="inpNombre" placeholder="Tu nombre" required>

        <label>Apellido</label>
        <input type="text" id="inpApellido" placeholder="Tu apellido" required>

        <label>WhatsApp / Teléfono</label>
        <input type="tel" id="inpTelefono" placeholder="+51 999 999 999" required>

        <label>País y Ciudad</label>
        <input type="text" id="inpPais" placeholder="Ej: Perú - Lima" required>

        <label>Iglesia o Ministerio</label>
        <input type="text" id="inpIglesia" placeholder="Nombre de tu iglesia" required>

        <button type="submit" id="btnGuardar" class="btn-save">Guardar Cambios</button>
        <button type="button" class="btn-cancel" onclick="mostrarFormularioPerfil(false)">Cancelar</button>
      </form>

      <p id="msgExito" style="display:none; color:#059669; text-align:center; font-weight:700; font-size:0.85rem; margin-top:12px;">
        ✅ ¡Tus datos han sido actualizados!
      </p>
    </section>

    <a href="/intranet/diario/" class="stat-box" style="text-decoration:none; display:flex; align-items:center; gap:14px; background:linear-gradient(135deg, #1a365d 0%, #0e9594 100%); color:#ffffff; padding:20px; border-radius:14px;">
  <span class="material-symbols-outlined" style="font-size:38px;">book_4</span>
  <div>
    <h3 style="margin:0; font-size:1.1rem; color:#fff;">Abrir Mi Diario de Oración</h3>
    <p style="margin:4px 0 0 0; font-size:0.82rem; opacity:0.9;">Revisa tus oraciones, motivos guardados, testimonios y peticiones personales.</p>
  </div>
</a>

  </main>

  
</body>
</html>
