<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Intranet — Movilización Turquía</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a365d 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .auth-card {
      background: #ffffff;
      max-width: 400px;
      width: 100%;
      border-radius: 16px;
      padding: 32px 26px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .auth-logo { height: 38px; margin-bottom: 16px; }
    h2 { margin: 0 0 8px 0; color: #1a365d; font-size: 1.35rem; }
    .subtitle { font-size: 0.88rem; color: #64748b; margin-bottom: 22px; line-height: 1.5; }
    .btn-google {
      width: 100%; padding: 11px 16px; border-radius: 8px; border: 1px solid #cbd5e1;
      background: #fff; color: #1e293b; font-weight: 600; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    }
    .btn-google:hover { background: #f8fafc; }
    .divider { display: flex; align-items: center; margin: 18px 0; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
    .divider span { padding: 0 10px; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-form input { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; }
    .btn-submit { background: #0e9594; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .auth-error { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; padding: 8px; border-radius: 6px; font-size: 0.82rem; display: none; }
    .btn-wa {
      background: #25d366; color: #fff; text-decoration: none; padding: 12px 16px;
      border-radius: 8px; font-weight: 700; font-size: 0.9rem; display: flex;
      align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px;
    }
    .btn-logout { background: none; border: none; color: #64748b; font-size: 0.82rem; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <!-- VISTA 1: LOGIN -->
  <div id="login-screen" class="auth-card">
    <img src="boletin-de-oracion/images/Logowebmt1.png" alt="MMM Turquía" class="auth-logo">
    <h2>Intranet de Intercesión</h2>
    <p class="subtitle">Inicia sesión para acceder al Boletín de Oración por Turquía.</p>

    <button type="button" onclick="loginWithGoogle()" class="btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
      <span>Continuar con Google</span>
    </button>

    <div class="divider"><span>o con tu correo</span></div>

    <form id="login-form" class="auth-form">
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <p id="error-msg" class="auth-error"></p>
      <button type="submit" class="btn-submit">Ingresar</button>
    </form>
  </div>

  <!-- VISTA 2: PENDIENTE DE APROBACIÓN -->
  <div id="pending-screen" class="auth-card" style="display: none;">
    <h2>Solicitud en Revisión</h2>
    <p class="subtitle">Tu cuenta está registrada. Solicita al equipo coordinador la activación de tu acceso:</p>
    <a id="whatsapp-link" href="#" target="_blank" class="btn-wa">
      <span class="material-symbols-outlined">chat</span>
      <span>Solicitar Aprobación por WhatsApp</span>
    </a>
    <button type="button" onclick="logout()" class="btn-logout">Cerrar sesión</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      GoogleAuthProvider, 
      signInWithPopup, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBeuFR_MvuAWKan95TEhKvyap51n189tcM",
      authDomain: "intranet-movilizacion-turquia.firebaseapp.com",
      projectId: "intranet-movilizacion-turquia",
      storageBucket: "intranet-movilizacion-turquia.firebasestorage.app",
      messagingSenderId: "633633525264",
      appId: "1:633633525264:web:93010e98058338f3580495"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('login-screen');
    const pendingScreen = document.getElementById('pending-screen');
    const whatsappLink = document.getElementById('whatsapp-link');
    const errorMsg = document.getElementById('error-msg');

    function mostrarError(texto) {
      errorMsg.textContent = texto;
      errorMsg.style.display = 'block';
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginScreen.style.display = 'none';
        try {
          const userRef = doc(db, "usuarios", user.uid);
          const userSnap = await getDoc(userRef);

          if (!userSnap.exists()) {
            await setDoc(userRef, {
              nombre: user.displayName || user.email.split('@')[0],
              email: user.email,
              aprobado: false,
              fechaRegistro: new Date()
            });
          }

          onSnapshot(userRef, (snap) => {
            const data = snap.data();
            if (data && data.aprobado === true) {
              window.location.replace("/intranet/boletin-de-oracion/");
            } else {
              pendingScreen.style.display = 'block';
              const msg = encodeURIComponent(`Hola, me registré en la intranet con el correo ${user.email} y solicito aprobación para acceder al Boletín de Oración.`);
              whatsappLink.href = `https://wa.me/51983204456?text=${msg}`;
            }
          });
        } catch (dbErr) {
          console.error("Error de Firestore:", dbErr);
          loginScreen.style.display = 'block';
          mostrarError("Falta activar Firestore Database o sus reglas en Firebase (" + dbErr.code + ")");
        }
      } else {
        loginScreen.style.display = 'block';
        pendingScreen.style.display = 'none';
      }
    });

    // Formulario Inteligente: Inicia sesión si ya existe, o lo Registra si es nuevo
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        // 1. Intentamos iniciar sesión
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        // 2. Si el usuario no existe aún, creamos su cuenta automáticamente
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          try {
            await createUserWithEmailAndPassword(auth, email, password);
          } catch (createErr) {
            if (createErr.code === 'auth/email-already-in-use') {
              mostrarError("Contraseña incorrecta para este correo.");
            } else if (createErr.code === 'auth/weak-password') {
              mostrarError("La contraseña debe tener al menos 6 caracteres.");
            } else if (createErr.code === 'auth/operation-not-allowed') {
              mostrarError("Falta habilitar 'Correo electrónico/contraseña' en Firebase Authentication.");
            } else {
              mostrarError("Error: " + createErr.message);
            }
          }
        } else if (err.code === 'auth/operation-not-allowed') {
          mostrarError("Falta habilitar 'Correo electrónico/contraseña' en Firebase Authentication.");
        } else {
          mostrarError("Error: " + err.code);
        }
      }
    });

    // Botón de Google con aviso claro si falta configurar el dominio
    window.loginWithGoogle = async () => {
      errorMsg.style.display = 'none';
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (err) {
        console.error("Error Google:", err);
        if (err.code === 'auth/unauthorized-domain') {
          mostrarError("Debes agregar 'www.mmmturquia.site' en Firebase > Authentication > Settings > Dominios autorizados.");
        } else if (err.code === 'auth/operation-not-allowed') {
          mostrarError("Debes habilitar el proveedor 'Google' en Firebase > Authentication > Sign-in method.");
        } else if (err.code !== 'auth/popup-closed-by-user') {
          mostrarError("Error al conectar con Google: " + err.code);
        }
      }
    };

    window.logout = () => signOut(auth);
  </script>
</body>
</html>
