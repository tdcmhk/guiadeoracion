<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19"/>
      <stop offset="50%" stop-color="#0c172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fced96"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8214"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base (Rounded Rect) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Frame -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Golden Radial Glow -->
  <circle cx="256" cy="230" r="190" fill="url(#glowGrad)"/>

  <!-- Radio Waves Outer -->
  <path d="M120 180 A160 160 0 0 1 392 180" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
  <path d="M155 205 A120 120 0 0 1 357 205" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M190 230 A80 80 0 0 1 322 230" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <!-- Antenna Mast and Central Beacon -->
  <g filter="url(#shadowFilter)">
    <!-- Central Pulsing Pearl -->
    <circle cx="256" cy="245" r="28" fill="url(#goldGrad)"/>
    <circle cx="256" cy="245" r="14" fill="#ffffff"/>

    <!-- Antenna Mast Tower -->
    <path d="M256 260 L256 360" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M226 315 L286 315" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M210 360 L302 360" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M235 360 L256 315 L277 360" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography MMM TURQUÍA -->
  <text x="256" y="418" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="4" fill="#ffffff">
    MMM TURQUÍA
  </text>
  
  <!-- Subtitle RADIO ESPERANZA -->
  <text x="256" y="450" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#d4af37">
    RADIO ESPERANZA 24/7
  </text>
</svg>
