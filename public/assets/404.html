<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MMM Turquía — Redirigiendo...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Redirige rutas SPA en servidores estáticos (ej. GitHub Pages) hacia la raíz manteniendo la ruta
      var path = window.location.pathname;
      sessionStorage.redirect = path;
      window.location.replace('/');
    </script>
    <style>
      body {
        margin: 0;
        background-color: #070d19;
        color: #f1f5f9;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .card {
        background: #0f172a;
        border: 1px solid rgba(255,255,255,0.1);
        padding: 30px;
        border-radius: 16px;
        max-width: 420px;
      }
      h1 { color: #f59e0b; margin-bottom: 8px; font-size: 22px; }
      p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
      a {
        display: inline-block;
        background: #0e9594;
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Cargando Plataforma MMM Turquía...</h1>
