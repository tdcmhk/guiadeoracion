<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#070d19"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Radio waves -->
  <g filter="url(#glow)">
    <!-- Wave 3 (Outer) -->
    <path d="M 120 180 A 150 150 0 0 1 392 180" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Wave 2 (Middle) -->
    <path d="M 160 215 A 110 110 0 0 1 352 215" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Wave 1 (Inner) -->
    <path d="M 200 250 A 70 70 0 0 1 312 250" fill="none" stroke="url(#goldGrad)" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Center Source Circle -->
  <circle cx="256" cy="275" r="22" fill="#d4af37" filter="url(#glow)"/>
  <circle cx="256" cy="275" r="12" fill="#ffffff"/>

  <!-- Tower / Base chevron -->
  <path d="M 235 375 L 256 325 L 277 375" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text: MMM TURQUÍA -->
  <text x="256" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="4">
    MMM TURQUÍA
  </text>

  <!-- Text: RADIO ESPERANZA 24/7 -->
  <text x="256" y="455" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="700" fill="#d4af37" letter-spacing="3">
    RADIO ESPERANZA 24/7
  </text>
</svg>
