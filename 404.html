<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Página no encontrada — MMM Turquía</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --primary: #1a365d;
      --secondary: #0e9594;
      --accent: #c1272d;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a365d 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card-404 {
      background: #ffffff;
      color: #1e293b;
      max-width: 460px;
      width: 100%;
      border-radius: 20px;
      padding: 36px 26px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .card-404::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
    }
    .icon-box {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f0fdfa;
      border: 2px solid #99f6e4;
      color: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }
    .icon-box span {
      font-size: 42px;
    }
    .code-badge {
      display: inline-block;
      background: #fef2f2;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 1.45rem;
      color: var(--primary);
    }
    p {
      margin: 0 0 24px 0;
      font-size: 0.92rem;
      color: #64748b;
      line-height: 1.5;
    }
    .actions-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-main {
      background: var(--secondary);
      color: #ffffff !important;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(14, 149, 148, 0.3);
      transition: background 0.2s, transform 0.15s;
    }
    .btn-main:hover {
      background: #0b7a79;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: var(--primary) !important;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #cbd5e1;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .countdown-text {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .countdown-num {
      font-weight: 700;
      color: var(--secondary);
    }
  </style>
</head>
<body>

  <div class="card-404">
    <div class="icon-box">
      <span class="material-symbols-outlined">explore_off</span>
    </div>

    <span class="code-badge">Aviso de Ruta</span>
    <h1>Página no encontrada</h1>
    <p>
      La dirección que intentas abrir ha cambiado de ubicación o el enlace es antiguo. Puedes dirigirte directamente al Boletín de Oración o a la página principal.
    </p>

    <!--<div class="actions-box">
      <a href="/intranet/boletin-de-oracion/" class="btn-main">
        <span class="material-symbols-outlined" style="font-size: 20px;">menu_book</span>
        <span>Ir al Boletín de Oración</span>
      </a>-->

      <a href="/es/" class="btn-secondary">
        <span class="material-symbols-outlined" style="font-size: 18px;">home</span>
        <span>Ir a la Página Principal</span>
      </a>
    </div>

    <!--<div class="countdown-text">
      Redirigiendo automáticamente en <span id="contador" class="countdown-num">6</span> segundos...
    </div>-->
  </div>

</html>
